name: BlazorEngine

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

# Prevent simultaneous releases from using the same version.
concurrency:
  group: blazorengine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/BlazorEngine/BlazorEngine.csproj

      - name: Build all projects
        run: |
          dotnet build src/BlazorEngine/BlazorEngine.csproj \
            -c Release --no-restore

      # Calculate the next package version
      - name: Calculate package version
        id: version
        if: github.event_name != 'pull_request'
        env:
          MAJOR_MINOR: "2.0"
          PREVIOUS_VERSION: ${{ vars.PACKAGE_VERSION_STATE }}
        shell: bash
        run: |
          # Validate major/minor version
          if [[ ! "$MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAJOR_MINOR: $MAJOR_MINOR"
            exit 1
          fi

          # Extract previous patch counter
          PATCH=0

          if [[ "$PREVIOUS_VERSION" =~ ^${MAJOR_MINOR}\.([0-9]+)$ ]]; then
            PATCH="${BASH_REMATCH[1]}"
          fi

          # Increment patch
          PATCH=$((PATCH + 1))

          VERSION="${MAJOR_MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Package version: $VERSION"

      - name: Pack
        if: github.event_name != 'pull_request'
        run: |
          dotnet pack "src/BlazorEngine/BlazorEngine.csproj" \
            -c Release \
            -o out \
            -p:PackageVersion=${{ steps.version.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name != 'pull_request'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        if: github.event_name != 'pull_request'
        run: dotnet nuget push ./out/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      # Update the counter ONLY after both publishing operations succeed
      - name: Update version counter
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.VERSION_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh variable set PACKAGE_VERSION_STATE --body "$VERSION"

          echo "Version counter updated to $VERSION"
