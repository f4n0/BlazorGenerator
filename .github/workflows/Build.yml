name: BlazorEngine

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

# Prevent simultaneous releases from using the same version.
concurrency:
  group: blazorengine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/BlazorEngine/BlazorEngine.csproj

      - name: Build all projects
        run: |
          dotnet build src/BlazorEngine/BlazorEngine.csproj \
            -c Release --no-restore

 # Calculate next version using NuGet.org
      - name: Calculate package version
        id: version
        if: github.event_name != 'pull_request'
        env:
          MAJOR_MINOR: "2.0"
          PACKAGE_ID: "BlazorEngine"
        shell: bash
        run: |
          set -euo pipefail

          # Validate configured version
          if [[ ! "$MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MAJOR_MINOR: $MAJOR_MINOR"
            exit 1
          fi

          # Query NuGet.org package versions
          URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID,,}/index.json"
          VERSIONS_FILE="$RUNNER_TEMP/nuget-versions.json"

          HTTP_STATUS=$(curl -sS \
            -o "$VERSIONS_FILE" \
            -w "%{http_code}" \
            "$URL")

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo '{"versions":[]}' > "$VERSIONS_FILE"
          elif [[ "$HTTP_STATUS" != "200" ]]; then
            echo "NuGet API returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Find highest stable patch for current major/minor
          LAST_PATCH=$(jq -r --arg prefix "${MAJOR_MINOR}." '
            .versions[]?
            | select(startswith($prefix))
            | .[($prefix | length):]
            | select(test("^[0-9]+$"))
          ' "$VERSIONS_FILE" | sort -n | tail -1)

          # Increment patch
          PATCH=$((${LAST_PATCH:-0} + 1))

          VERSION="${MAJOR_MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "Previous patch: ${LAST_PATCH:-none}"
          echo "New package version: $VERSION"
          echo "=================================="

      - name: Pack
        if: github.event_name != 'pull_request'
        run: |
          dotnet pack "src/BlazorEngine/BlazorEngine.csproj" \
            -c Release \
            -o out \
            -p:PackageVersion=${{ steps.version.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        if: github.event_name != 'pull_request'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        if: github.event_name != 'pull_request'
        run: dotnet nuget push ./out/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
